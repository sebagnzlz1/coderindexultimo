<main>
    <h1>Contacto</h1>
    <section>
        <h2>Canales de Contacto</h2>
        <figure> 
            <img src="../assets/canalesdecontacto.jpeg" alt="Ilustración de canales de contacto" width="400">
            <figcaption>Formas de ponerte en contacto conmigo.</figcaption>
        </figure>
        <article>
            <h3>Formulario de mensaje</h3>
            <form action="#" method="POST">
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                </div>
                <button type="submit">Enviar mensaje</button>
            </form>
        </article>
        <article>
            <h3>Redes y enlaces directos</h3>
            <p>También podés encontrarme en:</p>
            <ul>
                <li><a href="https://github.com/sebagnzlz1" target="_blank">GitHub</a></li>
                <li><a href="https://www.linkedin.com" target="_blank">LinkedIn</a></li>
            </ul>
